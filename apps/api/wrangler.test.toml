name = "projektor-api-test"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = [
	"nodejs_compat",
	# PROJ-656: required by @cloudflare/workers-oauth-provider for Client ID Metadata
	# Documents. `global_fetch_strictly_public` stops the outbound CIMD fetch using
	# legacy same-zone origin routing (SSRF protection); `cache_option_enabled` allows
	# the `cache` option that fetch uses, which would otherwise need a compatibility
	# date of 2024-11-11 or later. Both must be present or the
	# `client_id_metadata_document_supported: true` we advertise in
	# /.well-known/oauth-authorization-server is a lie.
	"global_fetch_strictly_public",
	"cache_option_enabled",
]

[[d1_databases]]
binding = "DB"
database_name = "projektor-test"
database_id = "00000000-0000-0000-0000-000000000000"

[[kv_namespaces]]
binding = "KV"
id = "00000000-0000-0000-0000-000000000001"

[[kv_namespaces]]
# PROJ-656/657: OAuth grants, authorization codes and access/refresh tokens. The
# binding name is fixed by the library, which reads env.OAUTH_KV directly. Separate
# from KV so a namespace wipe of one cache never silently signs everyone out.
binding = "OAUTH_KV"
id = "00000000-0000-0000-0000-000000000002"

[[r2_buckets]]
binding = "R2"
bucket_name = "projektor-files-test"

[vars]
ENVIRONMENT = "development"
JWT_SECRET = "test-secret-do-not-use-in-production"
BOOTSTRAP_SECRET = "test-bootstrap-secret-do-not-use-in-production"
# Low limits so rate-limit tests can trip 429 without looping hundreds of times.
# Safe for existing tests: auth limit=3 (only 1 unauthenticated /api/* request per file),
# api limit=5 (no single test makes >4 token-keyed requests with the same token).
RATE_LIMIT_AUTH_MAX = "3"
RATE_LIMIT_API_MAX = "5"
RATE_LIMIT_WINDOW_SECS = "60"
# Failed-bearer-auth throttle (PROJ-198). Low so the test can trip 429 by seeding a few
# failures. Safe for existing tests: setup.ts wipes rate_limit before each test, and no
# single test makes >3 failed bearer-auth requests from the same IP.
RATE_LIMIT_AUTH_FAIL_MAX = "3"
# PROJ-378 public feedback submit — low so the 429 tests can seed straight to the limit.
RATE_LIMIT_FEEDBACK_MAX = "5"
RATE_LIMIT_FEEDBACK_IP_MAX = "5"
