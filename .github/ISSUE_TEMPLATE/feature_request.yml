name: Feature request
description: Suggest an improvement or a new capability.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. The most useful requests describe the problem first and
        the solution second, so there's room to find the simplest fix.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Who hits it, and what do they do today instead?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: The behaviour you're proposing. Mention the surface (web app, MCP tool, REST API) if you have one in mind; REST and MCP are kept at parity, so a new capability usually lands on both.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
    validations:
      required: false
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd be interested in opening a pull request for this.
          required: false
