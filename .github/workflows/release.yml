name: Release

# Build a self-contained deploy artifact and attach it to a GitHub Release.
# Trigger by pushing a version tag (git tag v1.2.0 && git push --tags),
# or run manually via the Actions tab with a version input.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v1.2.0)'
        required: true

permissions:
  contents: write   # create the GitHub Release

jobs:
  # Run the full CI suite (tests, type-check, catalog freshness, island API) as a
  # gate. Reuses ci.yml so the checks never drift from the branch/PR CI. The
  # release job below won't start unless this passes.
  ci:
    name: CI checks
    uses: ./.github/workflows/ci.yml

  release:
    name: Build & publish release artifact
    needs: ci
    runs-on: ubuntu-latest
    environment: production-release
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # wrangler 4.x requires Node >= 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build release artifact
        run: bash scripts/build-release.sh "$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A hyphen in the version means a pre-release (v1.2.0-rc.1). Marking it
          # as such keeps it out of "latest", so a deploy repo pinned to latest
          # never picks up a release candidate by accident.
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$VERSION" "dist/projektor-$VERSION.tar.gz" \
            --title "$VERSION" \
            --generate-notes $PRERELEASE

      # Optionally notify a downstream deploy repo so it can auto-deploy this
      # release. Stays generic: only fires if the DEPLOY_DISPATCH_REPO repo
      # variable is set (Settings → Secrets and variables → Actions → Variables).
      # Needs WORKSPACE_PAT with permission to POST dispatches to that repo
      # (classic PAT: `repo`; fine-grained: Contents read/write on the target).
      - name: Notify deploy repo
        if: vars.DEPLOY_DISPATCH_REPO != ''
        env:
          GH_TOKEN: ${{ secrets.WORKSPACE_PAT }}
        run: |
          gh api "repos/${{ vars.DEPLOY_DISPATCH_REPO }}/dispatches" \
            -f event_type=projektor-release \
            -F "client_payload[version]=$VERSION"
