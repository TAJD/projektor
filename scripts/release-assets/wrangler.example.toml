# projektor deploy config - copy this to ./wrangler.toml and fill in the REPLACE_ values.
#
# This file ships inside the release artifact. After you extract the artifact into
# ./vendor, the paths below (worker.js, web, migrations) resolve relative to your
# deploy repo root. You own this copy: fill in your Cloudflare resource IDs once;
# on a version bump, re-extract the artifact - these paths do not change.

name = "projektor"
main = "./vendor/worker.js"
compatibility_date = "__COMPAT_DATE__"
compatibility_flags = [
  "nodejs_compat",          # required: the bundled worker imports node:stream / node:events
  # Both required for OAuth Client ID Metadata Documents, which is how Claude
  # registers itself as a connector (PROJ-656). global_fetch_strictly_public keeps
  # the outbound CIMD fetch off legacy same-zone origin routing (SSRF protection);
  # cache_option_enabled permits the `cache` option that fetch uses. Remove either
  # and the authorization server metadata advertises CIMD support the server does
  # not actually have, and every Claude connection fails at registration.
  "global_fetch_strictly_public",
  "cache_option_enabled",
]

# ─── Static Assets (pre-built Astro frontend, shipped in the artifact) ─────────
#   - /api/*, /mcp/*  → always the Worker (run_worker_first)
#   - /wiki (exact)    → always the Worker too (PROJ-487): it's a static asset
#     (wiki/index.html) that would otherwise never reach the Worker, so the legacy
#     `?slug=` query param could never become a real HTTP redirect. /wiki/:slug
#     subpaths don't need to be listed here — they have no matching static asset,
#     so Cloudflare already falls through to the Worker for those.
#   - /.well-known/*  → always the Worker (PROJ-650). OAuth discovery metadata
#     (RFC 9728 protected resource metadata, RFC 8414 authorization server
#     metadata) is served by the Worker and there is no static asset to fall
#     through from, so without this the SPA fallback answers instead and every
#     MCP client's discovery probe 404s. Do not prune this as unused: nothing in
#     the test suite or `wrangler dev` can catch its absence, because neither has
#     an [assets] binding — the failure only appears in a real deploy.
#   - everything else  → static assets, asset-first
[assets]
directory = "./vendor/web"
binding = "ASSETS"
run_worker_first = ["/api/*", "/mcp/*", "/wiki", "/.well-known/*"]

# ─── Cron Triggers ─────────────────────────────────────────────
# Daily sweep for the 30-day wiki trash purge (see `scheduled` in src/index.ts).
# Cron expressions are UTC.
[triggers]
crons = ["0 3 * * *"]

# ─── D1 Database ───────────────────────────────────────────────
# Create with: wrangler d1 create projektor
[[d1_databases]]
binding = "DB"
database_name = "projektor"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "./vendor/migrations"

# ─── KV Namespace ──────────────────────────────────────────────
# Create with: wrangler kv namespace create projektor
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# --- OAuth KV Namespace ----------------------------------------
# Create with: wrangler kv namespace create projektor-oauth
# Holds OAuth grants, authorization codes and access/refresh tokens (PROJ-656/657).
# The binding name is fixed - the OAuth library reads env.OAUTH_KV directly - and it
# is deliberately a SEPARATE namespace from KV above: clearing the cache namespace
# must never revoke everyone's connectors.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "REPLACE_WITH_YOUR_OAUTH_KV_NAMESPACE_ID"

# ─── R2 Bucket ─────────────────────────────────────────────────
# Create with: wrangler r2 bucket create projektor-files
[[r2_buckets]]
binding = "R2"
bucket_name = "projektor-files"

# ─── Static vars (non-secret) ──────────────────────────────────
[vars]
ENVIRONMENT = "production"
CF_ACCESS_TEAM_DOMAIN = "REPLACE_WITH_YOUR_TEAM.cloudflareaccess.com"
CF_ACCESS_AUDIENCE   = "REPLACE_WITH_YOUR_CF_ACCESS_AUDIENCE_TAG"

# ─── Login provisioning (services/provisioning.ts) ─────────────
# Cloudflare Access gates who can log in; these decide what they get inside.
# ADMIN_EMAILS → owners (the first to log in creates the default workspace).
# Everyone else CF admits joins as AUTO_JOIN_ROLE (viewer|member|admin|owner|none).
ADMIN_EMAILS = "REPLACE_WITH_YOUR_ADMIN_EMAILS_COMMA_SEPARATED"
DEFAULT_WORKSPACE_SLUG = "projektor"
DEFAULT_WORKSPACE_NAME = "Projektor"
AUTO_JOIN_ROLE = "viewer"

# Off by default: resolve the workspace from the X-Workspace-Slug header only.
# Set to "true" only if you've provisioned real workspace subdomains in DNS
# (team.example.com -> slug "team") - otherwise the Host header's leading label
# is just a CDN/proxy artifact, not a real tenant signal.
# Upgrade note: this used to be effectively always-on for hosts with a
# subdomain; if you relied on that, set this explicitly or switch clients to
# send X-Workspace-Slug.
# WORKSPACE_SUBDOMAIN_ROUTING = "true"

# ─── Secrets (set ONCE; they persist on the Worker across every deploy) ────────
#   wrangler secret put JWT_SECRET
# JWT_SECRET - random string used for API token signing. CI does NOT manage this;
# set it once and it survives future deploys.
