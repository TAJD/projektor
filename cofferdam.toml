# cofferdam.toml — code-quality analyzer config.
# Each [checks."X.Y"] block overrides the built-in defaults for one
# check. Uncomment and edit the values you actually want to change;
# missing checks use their built-in defaults.
#
# Severity gating (medium and above fails CI by default — change with
# `cofferdam check --fail-on=<level>`):
#   info | low | medium | high | critical

# IslandApiConvention (CD-69): ports scripts/check-island-api.sh.
# pathPatterns is declared inside the plugin itself (plugins/island-api,
# cd-81a.5), not here — this file has no per-path override.
plugins = ["./plugins/island-api", "./plugins/design-system"]

# [checks."Readability.MaxLineLength"]
# limit = 120
# severity = "low"

# Gating (medium) so long PRODUCTION functions fail CI again (PROJ-300).
# cofferdam.toml has no per-path/per-glob override (only `limit`/`severity`
# per check, applied project-wide). Vitest integration tests legitimately run
# 60-100+ line linear arrange-act-assert bodies (multi-step API setup, several
# assertions per scenario) — normal test style, not a code smell the way a
# 90-line production function is. The few existing over-long test describe
# blocks carry an inline `// cofferdam-ignore: Readability.MaxFunctionLength`
# so the baseline stays empty; any new long function (test or source) still
# surfaces as a finding and fails CI.
[checks."Readability.MaxFunctionLength"]
limit = 100
severity = "medium"

# [checks."Design.MaxParameters"]
# limit = 5
# severity = "medium"

# [checks."Design.DuplicateExportName"]
# severity = "medium"

# [checks."Refactor.CyclomaticComplexity"]
# severity = "medium"

# [checks."Refactor.CognitiveComplexity"]
# severity = "medium"

# [checks."Refactor.DuplicateBlock"]
# severity = "medium"

# [checks."Warning.TripleEquals"]
# severity = "high"

# [checks."Consistency.QuoteStyle"]
# severity = "low"

# --- Path-scoped overrides (PROJ-613) ----------------------------------------

# `Consistency.SpellingDialect` counts any string literal containing a space as
# prose, and a Tailwind class list qualifies — on poker-puzzle it recommended
# rewriting `items-center` as `items-centre`, which silently breaks the UI.
# Filed upstream as cofferdam CD-319. Off across the estate until that lands.
[[overrides]]
paths = ["**"]
[overrides.checks."Consistency.SpellingDialect"]
disabled = true

# `Design.MissingTestFile` scoped to the code where a sibling unit test is
# genuinely the expected form. Zod request schemas and Drizzle table
# definitions are declarations with no behaviour to test; islands are covered
# by the Playwright e2e suite rather than one spec per component; test helpers
# and plugin fixtures are test infrastructure. What remains — services, routes,
# MCP handlers, middleware, shared libs — is where a missing test is a gap.
# 176 findings -> 100.
[[overrides]]
paths = [
  "apps/api/src/schemas/**",
  "packages/db/src/schema/**",
  "apps/web/src/islands/**",
  "apps/web/e2e/**",
  "**/src/test/**",
  "plugins/*/fixtures/**",
]
[overrides.checks."Design.MissingTestFile"]
disabled = true

# The design-system plugin's fixture is a file of deliberate violations — it is
# the plugin's test input — and it reports eight findings at `high` in a
# whole-project run, the loudest thing in the output. There is no way to
# suppress them: `[[overrides]]` has no effect on checks that come from a JS
# plugin, not even with `paths = ["**"]`, while the identical stanza works on
# built-ins in this same file. Filed upstream as cofferdam CD-321. They sit in
# the baseline until it lands. CI is unaffected — it scopes the check to
# apps/web/src, where there are none.
