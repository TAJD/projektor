# cofferdam.toml — local config for the island-api plugin fixture (CD-69).
#
# Self-contained next to the plugin so `cofferdam check
# fixtures/apps/web/src/islands/fixture.ts --config ./cofferdam.toml` is
# reproducible without polluting the repo-root config. The fixture lives
# under fixtures/apps/web/src/islands/ (not flat) because the check's own
# `files.pathPatterns: ["apps/web/src/islands/**"]` scope must match it —
# scoping lives in the plugin (cd-81a.5), not in this config file.

plugins = ["./"]

[checks."IslandApiConvention"]
severity = "high"
